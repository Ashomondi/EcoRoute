services:
  db:
    image: postgres:16-alpine
    container_name: ecoroute-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecoroute
      POSTGRES_PASSWORD: ecoroute
      POSTGRES_DB: ecoroute
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoroute -d ecoroute"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
