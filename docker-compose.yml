services:
  db:
    image: postgres:16-alpine
    container_name: ecoroute-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecoroute
      POSTGRES_PASSWORD: ecoroute
      POSTGRES_DB: ecoroute
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoroute -d ecoroute"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: ecoroute-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ecoroute
      DB_PASSWORD: ecoroute
      DB_NAME: ecoroute
      JWT_SECRET: ${JWT_SECRET:-ecoroute-dev-secret-change-me}
      # Required when creating administrator accounts from /admin/signup.
      ADMIN_INVITE_CODE: ${ADMIN_INVITE_CODE:-ecoroute-admin-2024}
      AI_SERVICE_URL: http://ai:8000
      AI_TIMEOUT: 2s
      CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "8080:8080"

  ai:
    build: ./ai
    container_name: ecoroute-ai
    restart: unless-stopped
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: ecoroute-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
